[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ropnroll"
version = "0.2.0"
description = "Semantic ROP/JOP gadget finder and automatic exploit-chain synthesizer"
readme = "README.md"
keywords = ["rop", "jop", "gadgets", "binary-analysis", "security"]
requires-python = ">=3.10"
dependencies = [
    "capstone>=5.0",
    "lief>=0.14",
    "unicorn>=2.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/jordanallred/ropnroll"
Repository = "https://github.com/jordanallred/ropnroll"
Issues = "https://github.com/jordanallred/ropnroll/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "keystone-engine>=0.9",
]

[project.scripts]
ropnroll = "ropnroll.cli.main:main"

[tool.setuptools.packages.find]
include = ["ropnroll*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
